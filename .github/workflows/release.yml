name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - run: pnpm install --frozen-lockfile
      - name: Verify release tag
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version v${version}."
            exit 1
          fi
      - run: pnpm run lint
      - run: pnpm run test:types
      - run: pnpm run test:examples
      - run: pnpm run test:e2e:types

  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test

  browser-e2e:
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:browser
      - run: pnpm run test:e2e

  package-checks:
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run size:ci
      - run: pnpm run coverage
      - run: pnpm run test:mutation:smoke
      - run: pnpm run benchmark:ci
      - name: Build exact publish artifact
        run: |
          pnpm run build
          mkdir -p release-artifact
          npm pack --pack-destination release-artifact
          mv release-artifact/*.tgz release-artifact/travels.tgz
          sha256sum release-artifact/travels.tgz
      - name: Smoke test exact publish artifact
        run: |
          mkdir -p release-consumer
          tar -xzf release-artifact/travels.tgz -C release-consumer
          node scripts/verify-packed-package.js release-consumer/package
      - name: Upload exact publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: release-artifact/travels.tgz
          if-no-files-found: error
          retention-days: 7

  build-pages:
    runs-on: ubuntu-latest
    needs: [quality, unit, browser-e2e, package-checks]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir website install --frozen-lockfile
      - name: Build Fumadocs website
        env:
          BASE_PATH: /travels
          SITE_URL: https://mutativejs.github.io/travels
        run: pnpm run build:doc:site

  publish-npm:
    runs-on: ubuntu-latest
    needs: [build-pages, package-checks]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install --global npm@11.5.1
      - name: Download tested package artifact
        uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: release-artifact
      - name: Choose npm dist-tag
        id: dist-tag
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          # Without --tag, npm moves `latest` to whatever was published last,
          # so a maintenance release of an older major would replace the
          # current major. Only a version above the published latest takes it.
          current_latest="$(npm view travels dist-tags.latest 2>/dev/null || true)"
          dist_tag="$(CURRENT_LATEST="${current_latest}" node -e '
            const version = process.env.RELEASE_VERSION.replace(/^v/, "");
            const latest = process.env.CURRENT_LATEST.trim();
            const parse = (value) => value.split("-")[0].split(".").map(Number);
            const newer = (left, right) => {
              for (let index = 0; index < 3; index += 1) {
                if (left[index] !== right[index]) return left[index] > right[index];
              }
              return false;
            };
            if (version.includes("-")) {
              console.log("next");
            } else if (!latest || newer(parse(version), parse(latest))) {
              console.log("latest");
            } else {
              console.log(`v${parse(version)[0]}-latest`);
            }
          ')"
          echo "Publishing ${RELEASE_VERSION} with dist-tag ${dist_tag} (current latest: ${current_latest:-none})"
          echo "tag=${dist_tag}" >> "${GITHUB_OUTPUT}"
      - name: Publish tested package artifact
        env:
          CI: true
          DIST_TAG: ${{ steps.dist-tag.outputs.tag }}
        run: |
          sha256sum release-artifact/travels.tgz
          # Keep ./ so npm treats this as a local tarball, not a GitHub shorthand.
          npm publish ./release-artifact/travels.tgz --tag "${DIST_TAG}"

  request-pages-deploy:
    runs-on: ubuntu-latest
    needs: publish-npm
    timeout-minutes: 20
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Dispatch API Docs deployment
        id: dispatch-pages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          requested_at="$(date -u -d '30 seconds ago' +%Y-%m-%dT%H:%M:%SZ)"
          echo "run_name=API Docs for ${RELEASE_REF}" >> "${GITHUB_OUTPUT}"
          echo "requested_at=${requested_at}" >> "${GITHUB_OUTPUT}"
          curl --fail-with-body --show-error --silent \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Content-Type: application/json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/docs.yml/dispatches" \
            --data "{\"ref\":\"main\",\"inputs\":{\"release_ref\":\"${RELEASE_REF}\"}}"
      - name: Wait for API Docs deployment
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_AT: ${{ steps.dispatch-pages.outputs.requested_at }}
          RUN_NAME: ${{ steps.dispatch-pages.outputs.run_name }}
        run: |
          for attempt in $(seq 1 90); do
            response="$(curl --fail-with-body --show-error --silent \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/docs.yml/runs?event=workflow_dispatch&branch=main&per_page=20")"
            run_info="$(printf '%s' "${response}" | node -e '
              const fs = require("fs");
              const payload = JSON.parse(fs.readFileSync(0, "utf8"));
              const run = (payload.workflow_runs || []).find((candidate) =>
                candidate.display_title === process.env.RUN_NAME &&
                candidate.created_at >= process.env.REQUESTED_AT
              );
              if (run) {
                console.log([run.id, run.status, run.conclusion || "", run.html_url].join("\u001f"));
              }
            ')"
            if [ -n "${run_info}" ]; then
              IFS=$'\037' read -r run_id status conclusion html_url <<< "${run_info}"
              echo "API Docs run ${run_id}: ${html_url} (${status}${conclusion:+/${conclusion}})"
              if [ "${status}" = "completed" ]; then
                if [ "${conclusion}" = "success" ]; then
                  exit 0
                fi
                echo "API Docs deployment failed with conclusion ${conclusion}."
                exit 1
              fi
            else
              echo "Waiting for API Docs run to start..."
            fi
            sleep 10
          done

          echo "Timed out waiting for API Docs deployment."
          exit 1
