name: API Docs
run-name: API Docs for ${{ inputs.release_ref }}

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Release tag or ref to build API docs from.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Validate release ref
        env:
          RELEASE_REF: ${{ inputs.release_ref }}
        run: |
          if ! printf '%s' "${RELEASE_REF}" | grep -Eq '^v[0-9]+[.][0-9]+[.][0-9]+(-[0-9A-Za-z.-]+)?([+][0-9A-Za-z.-]+)?$'; then
            echo "release_ref must be a release tag like v1.3.0."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.release_ref }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: 'pnpm'
          cache-dependency-path: |
            pnpm-lock.yaml
            website/pnpm-lock.yaml
      - name: Verify release tag
        env:
          RELEASE_REF: ${{ inputs.release_ref }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${RELEASE_REF}" != "v${version}" ]; then
            echo "Tag ${RELEASE_REF} does not match package version v${version}."
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir website install --frozen-lockfile
      - name: Build Fumadocs website
        env:
          BASE_PATH: /travels
          SITE_URL: https://mutativejs.github.io/travels
        run: pnpm run build:doc:site
      - name: Deploy website to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REF: ${{ inputs.release_ref }}
        run: |
          git remote set-url origin "https://git:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # Keep the publisher independent of the checked-out tag so older
          # releases can be redeployed before they gain the root devDependency.
          pnpm dlx gh-pages@6.3.0 \
            --dist docs-site \
            --branch gh-pages \
            --dotfiles \
            --remove "{**/*,**/.*,**/.*/**/*}" \
            --user "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>" \
            --message "Deploy website for ${RELEASE_REF}" \
            --silent
